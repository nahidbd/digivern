# Turns image requests in images.js into images (licensed Wikimedia Commons photos, or AI-generated illustrations as a fallback).
# Runs whenever images.js changes on main, and can be started by hand. Commits the images and the updated images.js back to main.
# Illustrations: Cloudflare Workers AI (secrets CF_ACCOUNT_ID and CF_AI_TOKEN, free daily allowance), then Gemini (GEMINI_API_KEY) if it has image access.
name: Process images

on:
  push:
    branches: [main]
    paths: ['images.js']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: process-images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install image tools
        run: npm install --no-save --no-package-lock sharp@0.33.5
      - name: Fetch photos and create illustrations
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
        run: node tools/process-images.mjs --site . --max 12
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images.js img
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -q -m "Images for news items"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 10; done
          exit 1
